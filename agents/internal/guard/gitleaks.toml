[extend]
useDefault = true

[[rules]]
id = "encrypted-task-blob"
description = "Encrypted agent task blob"
regex = '''gAAAAAB[A-Za-z0-9_-]{24,}'''
tags = ["agent", "encrypted-task"]

# Synthetic fixtures for TestSecretScanBlocks: AWS's own documented
# AKIAIOSFODNN7EXAMPLE, a placeholder Bearer token, a placeholder GitHub PAT,
# and a truncated PEM header -- not real credentials. Scoped to exactly this
# one file so nothing else is allowlisted.
[allowlist]
description = "Synthetic secret fixtures in the spec 1 implementation plan"
paths = [
  '''^docs/superpowers/plans/2026-08-07-agents-repo-context\.md$''',
]
