# Authoritative CI Verification Gate Template
# See template/ci/README.md for adoption, customization, and the hardening rules
# this file is built from.
#
# Every `uses:` action reference is pinned to an immutable commit SHA with a
# trailing version comment. A tag is a mutable pointer: `@v4` resolves to
# whatever the action's maintainer moved it to since the last run, so a tag
# reference means this gate's own definition can change under it without a
# commit here. The comment is what a version bump edits alongside the SHA; the
# SHA is what is enforced.
#
# There are deliberately no `paths:` filters. A required check that a path
# filter skips stays "Expected" on the pull request forever and blocks it rather
# than passing it, and the filter also skips verification for exactly the edits
# a cached test run is least likely to notice.
name: verify

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks git` walks commits, so a shallow checkout would scan only
          # the tip of a pull request.
          fetch-depth: 0
      - name: install gitleaks, checksum-verified
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          # The checksum proves the archive. These two prove the binary the scan
          # will actually run: PATH can resolve a preinstalled gitleaks first.
          resolved="$(command -v gitleaks)"
          [ "$resolved" = /usr/local/bin/gitleaks ] || { echo "gitleaks resolves to $resolved, not the checksum-verified install" >&2; exit 1; }
          installed="$(gitleaks version)"
          [ "$installed" = "${GITLEAKS_VERSION}" ] || { echo "gitleaks reports $installed, expected ${GITLEAKS_VERSION}" >&2; exit 1; }
      - name: scan commit history for secrets
        run: |
          set -euo pipefail
          # A repository that must allowlist a path or a synthetic fixture puts
          # its config at .gitleaks.toml and it is used automatically. Without
          # one, gitleaks' default rules run. The flag is added by an `if`, not
          # `[ -f x ] && ...`, because under `set -e` that idiom exits the script
          # whenever the file is absent.
          config=()
          if [ -f .gitleaks.toml ]; then
            config=(--config .gitleaks.toml)
          fi
          gitleaks git "${config[@]}" --redact --exit-code 1

  context:
    name: Repository Context & Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: verify agent instruction context
        run: |
          set -euo pipefail
          if [ ! -s AGENTS.md ] && [ ! -s CLAUDE.md ]; then
            echo "Error: Repository must contain a non-empty AGENTS.md or CLAUDE.md file." >&2
            exit 1
          fi
      - name: verify linguist-generated attributes for .agents/
        run: |
          set -euo pipefail
          if [ -d .agents ]; then
            # Matched as a whole line, because `agents doctor` matches the line
            # exactly: a substring match would accept a near miss such as
            # `.agents/** linguist-generated` or a trailing suffix that git
            # ignores.
            grep -qxF '.agents/** linguist-generated=true' .gitattributes 2>/dev/null \
              || { echo "Error: .agents/ is present, but the root .gitattributes has no exact line '.agents/** linguist-generated=true'." >&2; exit 1; }
          fi

  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # REPLACE THIS STEP BEFORE RELYING ON THE GATE. See the examples in
      # template/ci/README.md.
      #
      # It fails closed on purpose. The first version of this template echoed a
      # placeholder and exited 0, which made `gate` green on a repository where
      # nothing had been verified -- a check that cannot fail, which is the
      # defect the gate exists to catch. An adopter should see red until this
      # job runs their project's real lint and tests.
      - name: lint, format and test (template placeholder)
        run: |
          echo "Error: the quality job is still the template placeholder." >&2
          echo "Replace it with your project's lint, format and test commands." >&2
          echo "See template/ci/README.md for Go, Python, Node/TypeScript and static examples." >&2
          exit 1

  gate:
    # Deliberately no `name:`. The required status check's context is the job id,
    # `gate`, and a ruleset names that exact string; a pretty display name would
    # change the context and the ruleset would then wait for a check that never
    # appears.
    if: always()
    needs: [secrets, context, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: require every verification job to have succeeded
        run: |
          echo "secrets: ${{ needs.secrets.result }}"
          echo "context: ${{ needs.context.result }}"
          echo "quality: ${{ needs.quality.result }}"
          [ "${{ needs.secrets.result }}" = "success" ] || exit 1
          [ "${{ needs.context.result }}" = "success" ] || exit 1
          [ "${{ needs.quality.result }}" = "success" ] || exit 1
