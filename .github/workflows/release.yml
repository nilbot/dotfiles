name: release

# Design: spec 6 §5.1 as amended (Amendment 1, 2026-09-20).
#
# This workflow does not re-run `verify.yml`. A release tag points at a commit
# that was pushed to `master`, and that push already ran the gate there;
# re-running it here cost 11 of the 12 jobs (~13.2 of ~14.0 job-minutes, 94%) and
# proved nothing new about the same tree. So the release reads that evidence --
# one API call for a successful `verify` run on `master` for exactly this commit
# -- and then builds the tagged tree. Building here is not a duplicate of CI:
# `-X main.version` and the archive names both come from the tag, so the version
# is not knowable before the tag exists.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.6.0)'
        required: true
        type: string
      dry_run:
        description: 'Verify and package, but create no release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # The guard below reads workflow runs. A `permissions:` block sets every scope
  # it does not name to `none`, so without this line the guard fails closed on a
  # 403 for a tag whose CI is green.
  actions: read

env:
  GOWORK: off

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Inputs and ref names reach the shell through the environment rather than
      # `${{ }}` inside `run:`. A git ref may contain `$`, backticks and
      # parentheses, so interpolating a tag name into a script would paste it
      # into the shell; the environment cannot break out of its own quoting.
      - name: determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="$REF_NAME"
          fi
          [ -n "$VERSION" ] || { echo "::error::no tag to release"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION} (dry run: ${DRY_RUN:-false})"

      # The gate is the check a pull request must pass, so a tag is a promise
      # that the same commit passed it. This reads that evidence instead of
      # re-deriving it. Renaming `verify.yml` breaks this line deliberately:
      # a guard that cannot find its evidence must fail, not pass.
      - name: the tagged commit must have a green verify run on master
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # `commits/<tag>` peels an annotated tag to its commit;
          # `git/ref/tags/<tag>` would hand back the tag object instead.
          SHA="$(gh api "repos/${REPO}/commits/${VERSION}" --jq .sha)" \
            || { echo "::error::${VERSION} does not resolve to a commit in ${REPO}"; exit 1; }
          # `head_sha` must be the full 40-character SHA: an abbreviated one
          # returns HTTP 200 with `total_count: 0`, which reads as "not verified"
          # for a commit that is.
          [ "${#SHA}" -eq 40 ] \
            || { echo "::error::${VERSION} resolved to '${SHA}', not a full commit SHA"; exit 1; }
          # `event=push` and `branch=master` are what make this a mainline
          # release: a green pull-request run for the same commit does not count.
          RUNS="$(gh api "repos/${REPO}/actions/workflows/verify.yml/runs?head_sha=${SHA}&status=success&event=push&branch=master&per_page=1" --jq .total_count)"
          if [ "${RUNS:-0}" -lt 1 ]; then
            echo "::error::${VERSION} (${SHA}) has no successful verify run on master."
            echo "Land the commit on master, wait for that push run to go green, then"
            echo "re-run this workflow: the tag does not need to be re-pushed."
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "verified ${VERSION} (${SHA}) against its green master run"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the dispatched ref: a manual run used to package the
          # default branch's tree under the requested version number.
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: agents/go.sum

      - name: package release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash script/package-release.sh "$VERSION" dist

      # An archive built by the master push run could not carry the version it
      # is released under, so the release cannot transport CI's bytes. It
      # asserts its own instead: the packaged binary must report the tag version
      # and the commit whose green run was just read. That is what makes
      # "released what the gate verified" checkable rather than assumed.
      - name: the packaged binary must carry the tag version and the verified commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.verified.outputs.sha }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          tar -xzf "dist/agents_${VERSION}_linux_amd64.tar.gz" -C "$WORK" agents
          REPORTED="$("${WORK}/agents" version)"
          echo "packaged binary reports: ${REPORTED}"
          case "$REPORTED" in
            "agents ${VERSION} (commit: ${SHA},"*) ;;
            *)
              echo "::error::packaged binary reports '${REPORTED}', expected version ${VERSION} at commit ${SHA}"
              exit 1
              ;;
          esac
          ( cd dist && sha256sum -c checksums.txt )

      # The GitHub Release body is the authoritative carrier for the
      # deploy-before-flip prerequisite and the measured fleet baseline, and
      # generate_release_notes would omit both -- it only builds a body from
      # commit titles. So the notes are a committed file this step must find;
      # test -s fails the release rather than shipping an empty body, which is
      # the difference between a gate the reader sees and a release that looks
      # successful while carrying none of the prose it promises.
      - name: release notes must exist and be non-empty
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -s ".github/release-notes/${VERSION}.md"

      - name: Create GitHub Release
        if: steps.version.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: .github/release-notes/${{ steps.version.outputs.version }}.md
          files: |
            dist/agents_*_*.tar.gz
            dist/checksums.txt

      # There is no tap-sync step. The formula lives in nilbot/homebrew-tap and
      # is maintained there; this repository used to carry a copy of it and a
      # script that pushed a regenerated version over it, and neither is wanted:
      # the copy was four releases stale, it installed the binary and nothing
      # else, and a reader of this repository had no way to tell that the file
      # they were looking at was not the one `brew` reads.
      #
      # The consequence is deliberate and worth stating: **releasing does not
      # update the tap.** A release publishes the tarballs below; whoever wants
      # `brew upgrade agents` to deliver it updates the tap's formula from
      # `checksums.txt`. Until they do, `brew` keeps installing the previous
      # version, which is the honest behaviour rather than a silent no-op.

      - name: dry run summary
        if: steps.version.outputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.verified.outputs.sha }}
        run: |
          echo "dry run: ${VERSION} (${SHA}) verified, packaged and asserted;"
          echo "no release was created and no tap was touched."
